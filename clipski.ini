# Clipski Path Routing & Folder Aliases Configuration
#
# When opening a video inside `input_root\<GameFolder>\<file>`, exported clips
# are automatically saved to `output_root\<MappedGameFolder>\<file>`.
# If `<GameFolder>` is not listed under [Aliases], `output_root\<GameFolder>`
# is created automatically.
# Videos opened outside `input_root` save alongside the original video file.

